//
// build.gradle in TeamCode
//

// Custom definitions may go here

plugins {
    id 'com.android.application'
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }

    // Local unit tests (src/test) run on the host JVM against a "mockable" android.jar that
    // returns default values (0/null/false) instead of throwing on Android API calls. That's
    // what makes the desktop OpMode emulator in src/test/.../emulator possible -- see its README.
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation libs.androidx.core.ktx
}
